name: ci

# Checks only: no release build, no signing, no secrets (REQ-013).
# Caches are allowed here and must never be restored in a release build (REQ-012).
on:
  pull_request:
    branches: [develop, main]
  push:
    branches:
      - "feature/**"
      - "bugfix/**"
      - "release/**"
      - "hotfix/**"
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ci-check:
    # The job name is the status-check context. Do not rename it without updating the main ruleset.
    name: ci-check
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node stays: bun installs and builds, but Vitest runs on Node (REQ-014). No npm cache.
      - name: Set up Node from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # Keep bun-version equal to "packageManager" in package.json (one place to bump, two to edit).
      # no-cache: do not restore a cached bun executable.
      - name: Set up Bun
        id: setup-bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
          no-cache: true

      # The toolchain (and rustfmt/clippy) come from rust-toolchain.toml; rustup installs
      # it on the first rustc call, which rust-cache makes to put the version in its key.
      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: cargo fmt --check
        shell: bash
        run: cargo fmt --check

      - name: cargo clippy
        shell: bash
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        shell: bash
        run: cargo test --workspace

      # bun's global install cache (downloaded packages only, never node_modules).
      # A miss still gives a green build. Never restore it in a release build (REQ-012).
      - name: Cache bun install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ steps.setup-bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}

      - name: bun install --frozen-lockfile
        shell: bash
        run: bun install --frozen-lockfile

      - name: bun run build
        shell: bash
        run: bun run build

      - name: bun run test
        shell: bash
        run: bun run test
