name: ci

# Checks only: no release build, no signing, no secrets (REQ-013).
# Caches are allowed here and must never be restored in a release build (REQ-012).
on:
  pull_request:
    branches: [develop, main]
  push:
    branches:
      - "feature/**"
      - "bugfix/**"
      - "release/**"
      - "hotfix/**"
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ci-check:
    # The job name is the status-check context. Do not rename it without updating the main ruleset.
    name: ci-check
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Rust toolchain components
        shell: bash
        run: rustup component add rustfmt clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: cargo fmt --check
        shell: bash
        run: cargo fmt --check

      - name: cargo clippy
        shell: bash
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        shell: bash
        run: cargo test --workspace

      - name: npm ci
        shell: bash
        run: npm ci

      - name: npm run build
        shell: bash
        run: npm run build

      - name: npm test
        shell: bash
        run: npm test
